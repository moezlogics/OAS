<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
  <title>You are offline</title>
  <style>
    :root { --paper: #f3f4f7; --ink: #141a26; --muted: #667085; --brand: #2b4acb; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --paper: #0e1117; --ink: #eceef2; --muted: #8f98a6; --brand: #8098ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 64px; height: 64px; border-radius: 18px; }
    h1 { font-size: 22px; margin: 16px 0 6px; }
    p { color: var(--muted); margin: 0 0 20px; max-width: 320px; }
    .btn { display: inline-flex; align-items: center; min-height: 50px; padding: 0 28px; border-radius: 14px; background: var(--brand); color: #fff; font-weight: 600; font-size: 17px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You are offline</h1>
    <p>Check your WiFi or mobile data. Check-in needs the office WiFi.</p>
    <a class="btn" href="">Try again</a>
  </main>
</body>
</html>
