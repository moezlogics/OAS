<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Attendance">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Check in, see your fines and send leave requests.">
  <title>Attendance</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=11">
  <link rel="stylesheet" href="/css/employee.css?v=11">
</head>
<body>
  <!-- Sign in -->
  <section id="login" class="login" hidden>
    <div class="login-inner">
      <div class="login-brand">
        <img src="/icons/icon-192.png" alt="">
        <div>
          <h1 id="loginOffice">Attendance</h1>
          <p>Sign in once. This phone stays signed in.</p>
        </div>
      </div>

      <form id="loginForm" class="login-card" autocomplete="on" novalidate>
        <label class="field">
          <span>Employee code</span>
          <input class="input input-lg" id="loginCode" name="username" autocomplete="username" autocapitalize="characters" placeholder="EMP-101" required>
        </label>
        <label class="field">
          <span>PIN</span>
          <input class="input input-lg" id="loginPin" name="password" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" placeholder="4–6 digits" required>
        </label>
        <p class="form-error" id="loginError" role="alert" hidden></p>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Sign in</button>
      </form>
      <div class="login-foot" id="loginWifi"></div>
      <div class="login-foot" id="loginInstall"></div>
      <p class="login-note">Forgot your PIN? Ask the admin to reset it.</p>
    </div>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <h1 id="pageTitle">Today</h1>
      <button class="icon-btn" id="bellBtn" aria-label="Notifications"></button>
    </header>

    <main class="page" id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main">
      <div class="tabbar-inner">
        <a href="#home" data-tab="home"><span data-icon="home"></span>Today</a>
        <a href="#history" data-tab="history"><span data-icon="calendar"></span>History</a>
        <a href="#requests" data-tab="requests"><span data-icon="inbox"></span>Requests</a>
        <a href="#profile" data-tab="profile"><span data-icon="user"></span>Profile</a>
      </div>
    </nav>
  </div>

  <script src="/js/common.js?v=11"></script>
  <script src="/js/ribbon.js?v=11"></script>
  <script src="/js/employee.js?v=11"></script>
</body>
</html>
